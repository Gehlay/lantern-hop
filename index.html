<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lantern Hop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap">
<style>
:root{--bg:#dfe9e3;--ink:#2b2438;--panel:#f7fbf8;--accent:#e4572e;--muted:#5d6b66;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c2629;--ink:#efe8f7;--panel:#2a373b;--accent:#ff7a4d;--muted:#a9bbb5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c2629;--ink:#efe8f7;--panel:#2a373b;--accent:#ff7a4d;--muted:#a9bbb5;color-scheme:dark}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:880px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:1.6rem;font-weight:800;margin:0;letter-spacing:-.02em}
#hud{display:flex;gap:18px;font-weight:500;color:var(--muted)}
#hud b{color:var(--ink)}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:5/3}
canvas{display:block;width:100%;height:100%}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:rgba(28,22,40,.62);color:#fff}
#overlay.hide{display:none}
#overlay h2{font-size:clamp(1.6rem,5vw,2.6rem);margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
#overlay p{margin:0 0 18px;max-width:34ch;line-height:1.45}
button{font:inherit;font-weight:800;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 26px;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.help{margin:10px 2px 0;color:var(--muted);font-size:.92rem}
#touch{display:none;justify-content:space-between;margin-top:12px;gap:10px}
#touch div{display:flex;gap:10px}
#touch button{width:76px;height:64px;font-size:1.5rem;padding:0;background:var(--panel);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
@media (hover:none){#touch{display:flex}.help{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Lantern Hop</h1>
<div id="hud"><span>Level <b id="hl">1</b>/3</span><span>Lanterns <b id="hc">0</b></span><span>Falls <b id="hd">0</b></span></div></header>
<div class="stage"><canvas id="c" width="640" height="384"></canvas>
<div id="overlay"><h2 id="ot">Lantern Hop</h2><p id="op">Collect the lanterns and reach the flag. Stomp the moths, dodge the spikes.</p><button id="ob">Start</button></div></div>
<p class="help">Move: arrow keys or A / D. Jump: Space, W or Up (hold for a higher jump). Press jump again in mid-air to double jump. Restart level: R.</p>
<div id="touch"><div><button id="bl" aria-label="Left">◀</button><button id="br" aria-label="Right">▶</button></div><button id="bj" aria-label="Jump">▲</button></div>
</div>
<script>
(function(){
var T=32,VW=640,VH=384,ROWS=12;
var cv=document.getElementById('c'),cx=cv.getContext('2d');
var LV=[
{w:49,g:[[0,25],[28,31],[35,43],[46,48]],p:[[12,6,5],[18,9,3],[34,6,6],[37,9,3]],
 c:[[14,5],[15,5],[16,5],[7,8],[20,8],[22,8],[31,8],[35,5],[36,5],[42,8],[47,8]],s:[30],e:[[13,9],[38,8]],f:[47,9],st:[1,9]},
{w:56,g:[[0,9],[13,17],[21,22],[26,34],[38,42],[46,55]],p:[[11,8,3],[19,8,3],[24,8,2],[30,7,4],[36,8,3],[44,8,3]],
 c:[[12,7],[20,7],[24,7],[31,6],[37,7],[45,7],[3,8],[15,8],[28,8],[40,8],[52,8]],s:[15,28,40],e:[[5,9],[32,9],[50,9]],f:[54,9],st:[1,9]},
{w:60,g:[[0,6],[10,12],[16,17],[21,22],[26,27],[32,40],[44,45],[49,59]],p:[[8,8,2],[14,8,2],[19,8,2],[24,8,2],[29,8,3],[41,8,2],[46,7,2],[47,5,3]],
 c:[[8,7],[14,7],[19,7],[24,7],[30,7],[41,7],[47,4],[48,4],[11,9],[36,8],[52,8]],s:[3,35,52,55],e:[[34,9],[39,9],[53,9],[57,9]],f:[58,9],st:[1,9]}];
var lvl=0,grid,coins,spikes,enemies,flag,start,W,puff=null;
var state='title',total=0,deaths=0,cam=0,t=0,flash=0;
var P={x:0,y:0,w:20,h:26,vx:0,vy:0,on:false,coy:0,buf:0,dj:1,face:1};
var keys={l:0,r:0,j:0,jp:false};

function build(i){
 var L=LV[i];W=L.w;
 grid=[];for(var y=0;y<ROWS;y++){grid.push(new Array(W).fill(0));}
 L.g.forEach(function(r){for(var x=r[0];x<=r[1];x++){grid[10][x]=1;grid[11][x]=1;}});
 L.p.forEach(function(p){for(var x=p[0];x<p[0]+p[2];x++)grid[p[1]][x]=1;});
 coins=L.c.map(function(c){return{x:c[0],y:c[1],got:false};});
 spikes=L.s.slice();
 enemies=L.e.map(function(e){return{x:e[0]*T+4,y:(e[1]+1)*T-22,w:24,h:22,d:1,alive:true};});
 flag=L.f;start=L.st;respawn();
}
function respawn(){P.x=start[0]*T+6;P.y=(start[1]+1)*T-P.h;P.vx=P.vy=0;P.on=false;flash=40;}
function solid(tx,ty){if(tx<0||tx>=W)return true;if(ty<0||ty>=ROWS)return false;return grid[ty][tx]===1;}
function die(){deaths++;respawn();document.getElementById('hd').textContent=deaths;}

function moveX(){
 P.x+=P.vx;var y0=Math.floor(P.y/T),y1=Math.floor((P.y+P.h-1)/T),ty,tx;
 if(P.vx>0){tx=Math.floor((P.x+P.w-1)/T);for(ty=y0;ty<=y1;ty++)if(solid(tx,ty)){P.x=tx*T-P.w;P.vx=0;break;}}
 else if(P.vx<0){tx=Math.floor(P.x/T);for(ty=y0;ty<=y1;ty++)if(solid(tx,ty)){P.x=(tx+1)*T;P.vx=0;break;}}
}
function moveY(){
 P.y+=P.vy;P.on=false;var x0=Math.floor(P.x/T),x1=Math.floor((P.x+P.w-1)/T),ty,tx;
 if(P.vy>0){ty=Math.floor((P.y+P.h-1)/T);for(tx=x0;tx<=x1;tx++)if(solid(tx,ty)){P.y=ty*T-P.h;P.vy=0;P.on=true;break;}}
 else if(P.vy<0){ty=Math.floor(P.y/T);for(tx=x0;tx<=x1;tx++)if(solid(tx,ty)){P.y=(ty+1)*T;P.vy=0;break;}}
}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function update(){
 t++;if(flash>0)flash--;
 var dir=keys.r-keys.l;
 P.vx+=dir*0.6;if(!dir)P.vx*=0.78;
 P.vx=Math.max(-3.4,Math.min(3.4,P.vx));if(Math.abs(P.vx)<0.05)P.vx=0;
 if(dir)P.face=dir;
 if(keys.jp){P.buf=7;keys.jp=false;}
 if(P.buf>0)P.buf--;
 if(P.on){P.coy=6;P.dj=1;}else if(P.coy>0)P.coy--;
 if(P.buf>0&&P.coy>0){P.vy=-11.2;P.buf=0;P.coy=0;P.on=false;}
 else if(P.buf>0&&P.dj>0&&!P.on){P.vy=-10;P.buf=0;P.dj=0;puff={x:P.x+P.w/2,y:P.y+P.h,t:18};}
 if(!keys.j&&P.vy<-3)P.vy*=0.84;
 P.vy=Math.min(12,P.vy+0.55);
 moveX();moveY();
 if(P.y>ROWS*T+60){die();return;}
 var pc={x:P.x+3,y:P.y+3,w:P.w-6,h:P.h-3};
 coins.forEach(function(c){if(!c.got&&hit(pc,{x:c.x*T+8,y:c.y*T+6,w:16,h:20})){c.got=true;total++;document.getElementById('hc').textContent=total;}});
 for(var i=0;i<spikes.length;i++){if(hit(pc,{x:spikes[i]*T+5,y:9*T+16,w:22,h:16})){die();return;}}
 for(var k=0;k<enemies.length;k++){
  var e=enemies[k];if(!e.alive)continue;
  var nx=e.x+e.d*0.9,fx=e.d>0?nx+e.w:nx,tx=Math.floor(fx/T),ty=Math.floor((e.y+e.h-1)/T);
  if(solid(tx,ty)||!solid(tx,ty+1))e.d*=-1;else e.x=nx;
  if(hit(pc,e)){
   if(P.vy>0&&(P.y+P.h)-e.y<18){e.alive=false;P.vy=-8;}
   else{die();return;}
  }
 }
 if(hit(pc,{x:flag[0]*T+8,y:(flag[1]-1)*T,w:16,h:2*T})){win();}
 cam+=((P.x+P.w/2-VW/2)-cam)*0.12;cam=Math.max(0,Math.min(W*T-VW,cam));
}

function win(){
 if(lvl<LV.length-1){state='done';show('Level '+(lvl+1)+' clear','Lanterns so far: '+total+'. Falls: '+deaths+'.','Next level');}
 else{state='end';show('You made it home','You collected '+total+' lanterns with '+deaths+' falls.','Play again');}
}
var ov=document.getElementById('overlay'),ob=document.getElementById('ob');
function show(a,b,c){document.getElementById('ot').textContent=a;document.getElementById('op').textContent=b;ob.textContent=c;ov.classList.remove('hide');ob.focus();}
function go(){
 if(state==='title'||state==='play'&&false){lvl=0;total=0;deaths=0;}
 else if(state==='done'){lvl++;}
 else if(state==='end'){lvl=0;total=0;deaths=0;}
 document.getElementById('hl').textContent=lvl+1;
 document.getElementById('hc').textContent=total;document.getElementById('hd').textContent=deaths;
 build(lvl);cam=0;state='play';ov.classList.add('hide');
}
ob.addEventListener('click',go);

function draw(){
 var g=cx.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#9fd3cf');g.addColorStop(1,'#f4d9b0');
 cx.fillStyle=g;cx.fillRect(0,0,VW,VH);
 // parallax hills
 [[0.2,'#86bfb9',250,90],[0.4,'#6aa7a4',290,70]].forEach(function(h){
  cx.fillStyle=h[1];cx.beginPath();cx.moveTo(0,VH);
  for(var x=0;x<=VW;x+=8){var wx=x+cam*h[0];cx.lineTo(x,h[2]-Math.sin(wx/90)*h[3]*0.45-Math.sin(wx/37)*8);}
  cx.lineTo(VW,VH);cx.fill();
 });
 cx.save();cx.translate(-Math.round(cam),0);
 var c0=Math.floor(cam/T),c1=c0+Math.ceil(VW/T)+1;
 for(var y=0;y<ROWS;y++)for(var x=c0;x<=c1&&x<W;x++){
  if(grid[y][x]!==1)continue;
  cx.fillStyle='#3b2f4a';cx.fillRect(x*T,y*T,T,T);
  if(!solid(x,y-1)||y===0){cx.fillStyle='#4fb38f';cx.fillRect(x*T,y*T,T,7);cx.fillStyle='#74d1a8';cx.fillRect(x*T,y*T,T,3);}
  else{cx.fillStyle='#463a58';cx.fillRect(x*T+6,y*T+8,6,6);}
 }
 spikes.forEach(function(s){cx.fillStyle='#d9d2e6';for(var i=0;i<3;i++){cx.beginPath();cx.moveTo(s*T+i*10.6,10*T);cx.lineTo(s*T+i*10.6+5.3,9*T+10);cx.lineTo(s*T+i*10.6+10.6,10*T);cx.fill();}});
 // flag
 var fx=flag[0]*T+14,fy=flag[1]*T;
 cx.fillStyle='#f4efe6';cx.fillRect(fx,fy-T,4,2*T);
 cx.fillStyle='#e4572e';cx.beginPath();cx.moveTo(fx+4,fy-T);cx.lineTo(fx+30+Math.sin(t/8)*3,fy-T+10);cx.lineTo(fx+4,fy-T+22);cx.fill();
 // lanterns
 coins.forEach(function(c){if(c.got)return;var bob=Math.sin(t/14+c.x)*3,x=c.x*T+16,y=c.y*T+16+bob;
  cx.fillStyle='rgba(255,214,102,.28)';cx.beginPath();cx.arc(x,y,16,0,7);cx.fill();
  cx.fillStyle='#3b2f4a';cx.fillRect(x-5,y-10,10,3);cx.fillRect(x-5,y+7,10,3);
  cx.fillStyle='#ffc94a';cx.beginPath();cx.ellipse(x,y,7,8,0,0,7);cx.fill();
  cx.fillStyle='#fff1b8';cx.beginPath();cx.ellipse(x-2,y-2,2.5,3.5,0,0,7);cx.fill();});
 // moths
 enemies.forEach(function(e){if(!e.alive)return;var fl=Math.sin(t/4)*4;
  cx.fillStyle='#6b4f8a';cx.beginPath();cx.ellipse(e.x+12,e.y+14,11,8,0,0,7);cx.fill();
  cx.fillStyle='#8f72b3';cx.beginPath();cx.ellipse(e.x+4,e.y+7-fl/2,6,8,-.4,0,7);cx.ellipse(e.x+20,e.y+7-fl/2,6,8,.4,0,7);cx.fill();
  cx.fillStyle='#fff';cx.fillRect(e.x+7,e.y+10,4,5);cx.fillRect(e.x+14,e.y+10,4,5);
  cx.fillStyle='#2b2438';cx.fillRect(e.x+8+(e.d>0?1:0),e.y+12,2,3);cx.fillRect(e.x+15+(e.d>0?1:0),e.y+12,2,3);});
 if(puff){puff.t--;if(puff.t<=0)puff=null;else{cx.strokeStyle='rgba(255,255,255,'+(puff.t/18)+')';cx.lineWidth=3;cx.beginPath();cx.ellipse(puff.x,puff.y+2,(18-puff.t)*1.4+6,(18-puff.t)*0.5+3,0,0,7);cx.stroke();}}
 // player
 if(!(flash>0&&Math.floor(t/4)%2)){
  var sq=P.on?1:1-Math.min(0.12,Math.abs(P.vy)*0.012),px=P.x+P.w/2,py=P.y+P.h;
  cx.save();cx.translate(px,py);cx.scale(1/sq,sq);
  cx.fillStyle='#f2b134';cx.beginPath();cx.moveTo(-P.face*8,-12);cx.lineTo(-P.face*(20+Math.sin(t/5)*3),-6+Math.sin(t/6)*2);cx.lineTo(-P.face*8,-6);cx.fill();
  cx.fillStyle='#e4572e';cx.beginPath();cx.roundRect(-P.w/2,-P.h,P.w,P.h,8);cx.fill();
  cx.fillStyle='#fff';cx.fillRect(P.face*3-4,-P.h+7,5,6);cx.fillRect(P.face*3+4,-P.h+7,5,6);
  cx.fillStyle='#2b2438';cx.fillRect(P.face*3-3+(P.face>0?1:0),-P.h+9,2,3);cx.fillRect(P.face*3+5+(P.face>0?1:0),-P.h+9,2,3);
  cx.restore();
 }
 cx.restore();
}

function loop(){if(state==='play')update();if(grid)draw();requestAnimationFrame(loop);}
function kd(e,v){
 var k=e.key.toLowerCase();
 if(k==='arrowleft'||k==='a')keys.l=v;
 else if(k==='arrowright'||k==='d')keys.r=v;
 else if(k===' '||k==='arrowup'||k==='w'){if(v&&!keys.j)keys.jp=true;keys.j=v;}
 else return;
 if(state==='play')e.preventDefault();
}
addEventListener('keydown',function(e){
 if(e.key.toLowerCase()==='r'&&state==='play'){build(lvl);return;}
 kd(e,1);
});
addEventListener('keyup',function(e){kd(e,0);});
function bind(id,fn){var b=document.getElementById(id);
 b.addEventListener('pointerdown',function(e){e.preventDefault();fn(1);});
 ['pointerup','pointerleave','pointercancel'].forEach(function(n){b.addEventListener(n,function(){fn(0);});});}
bind('bl',function(v){keys.l=v;});bind('br',function(v){keys.r=v;});
bind('bj',function(v){if(v&&!keys.j)keys.jp=true;keys.j=v;});
build(0);state='title';loop();
})();
</script>
</body>
</html>
